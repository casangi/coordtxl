import org.jsweet.transpiler.EcmaScriptComplianceLevel

apply plugin: 'java'
apply plugin: 'java-library'
apply plugin: 'maven-publish'

// java compatibility version
sourceCompatibility = 1.11
targetCompatibility = 1.11

buildscript {
        ext {
                JSweetVersion = "3.1.0"
        }
        
        boolean snapshotMode = false;
        project.ext.repoType =  snapshotMode ? 'snapshot' : 'release';

        println "repoType=" + project.repoType + " JSweetVersion=${JSweetVersion}"

        repositories {
                mavenLocal()
                mavenCentral()
                gradlePluginPortal()
        }
        dependencies {
                // 1. Exclude the old, unresolvable org.jsweet.ext dependencies
                classpath("org.jsweet:jsweet-gradle-plugin:" + JSweetVersion) {
                    exclude group: 'org.jsweet.ext', module: 'typescript.java-ts.core'
                    exclude group: 'org.jsweet.ext', module: 'sourcemap-builder'
                }

                // 2. Map them to the verified Maven Central replacements
                classpath "io.apitomy:typescript-java-ts-core:3.1.3"
                classpath "io.apitomy:sourcemap-builder:3.1.3"

                // 3. Keep node-gradle
                classpath "com.github.node-gradle:gradle-node-plugin:5.0.0"
        }
}

repositories {
        mavenCentral()
}

dependencies {
        // 1. Maintain the working transpiler and apitomy extensions
        implementation(group: 'org.jsweet', name: 'jsweet-transpiler', version: JSweetVersion) {
            exclude group: 'org.jsweet.ext', module: 'typescript.java-ts.core'
            exclude group: 'org.jsweet.ext', module: 'sourcemap-builder'
        }

        implementation "io.apitomy:typescript-java-ts-core:3.1.3"
        implementation "io.apitomy:sourcemap-builder:3.1.3"

        implementation group: 'org.jsweet', name: 'jsweet-core', version: "6.3.0"

        // 2. Safe local fallback wrapper to bypass missing network repository resolution
        implementation files([])
}

/*****************************************************
compileJava {
        enabled = false
}
*****************************************************/

apply plugin: 'org.jsweet.jsweet-gradle-plugin'

jsweet {
        // Hardcode the absolute File path to your SDKMAN Java 17 home directory
        jdkHome = file("${System.getProperty('user.home')}/.sdkman/candidates/java/17.0.15-tem")

        module = 'commonjs'
        targetVersion = 'ES5'
        verbose = true
        encoding = 'UTF-8'
        sourceMap = true
        sourceRoot = project.file('src')
        tsOnly = true
        tsOut = project.file('build/typescript')
        outDir = project.file('.gradle/js')
        includes = ['**/coordtxl/**/*.java', '**/def/**/*.java']
}

// Force the internal Gradle compiler task wrapper to acknowledge the home directory location
System.setProperty("org.jsweet.transpiler.jdkHome", "${System.getProperty('user.home')}/.sdkman/candidates/java/17.0.15-tem")

rootProject.tasks.named("jsweet").configure {
    /**********************************************************************
    *** install custom typescript code                                  ***
    **********************************************************************/
    doLast {
        copy {
            from fileTree(project.file('src/main/typescript/coordtxl'))
            into project.file('build/typescript/coordtxl')
        }
    }
}

apply plugin: 'com.github.node-gradle.node'

node {
    yarnVersion = "1.22.19"
    download = true
}

task tsc( type: YarnTask ) {
    dependsOn yarn
    /**************************************************************
    ***  'jsweet' is both the extension name and the task name  ***
    **************************************************************/
    dependsOn tasks.findByName('jsweet')
    yarnCommand = [ "build" ]
    args = [ ]
}

task tstest( type: YarnTask ) {
    dependsOn tsc
    yarnCommand = [ "tstest" ]
}

task npmbuild( type: YarnTask ) {
    dependsOn tstest
    yarnCommand = [ "npmbuild" ]
}

task npmpub( type: YarnTask ) {
    dependsOn npmbuild
    yarnCommand = [ "npmpub" ]
}

tasks.named('jar') {
    manifest {
        attributes('Implementation-Title': "${project.name}",
                   'Implementation-Version': project.version)
    }

    archiveBaseName = "${rootProject.name}"
    archiveVersion = project.version
    doLast {
        sourceSets.each { srcSet ->
            println "["+srcSet.name+"]"
        }
        println sourceSets.nomtam.output
    }
}

configurations {
    nomtamCompile
}

sourceSets{
    nomtam {
        java {
            srcDirs("src/nomtam/java")
        }
        compileClasspath = sourceSets.main.compileClasspath
        compileClasspath += configurations.nomtamCompile
        runtimeClasspath = sourceSets.main.runtimeClasspath
    }
}

dependencies {
    nomtamCompile 'gov.nasa.gsfc.heasarc:nom-tam-fits:1.17.1'
    nomtamCompile files(jar.archivePath)
}

compileNomtamJava {
    dependsOn(jar.archiveFile)
}

dependencies {
    // Use TestNG framework, also requires calling test.useTestNG() below
    testImplementation 'org.testng:testng:7.5'
    testImplementation 'com.google.code.gson:gson:2.8.5'

    // This dependency is exported to consumers, that is to say found on their compile classpath.
    api 'org.apache.commons:commons-math3:3.6.1'

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation 'com.google.guava:guava:31.1-jre'
}

tasks.named('test') {
    // Use TestNG for unit tests.
    useTestNG()
    afterTest { desc, result ->
        logger.quiet "Executing test ${desc.name} [${desc.className}] with result: ${result.resultType}"
    }
}

task printSourceSetInformation(){

    doLast{
        println ">>>>>--------->>> ${rootProject.name}"
        sourceSets.each { srcSet ->
            println "["+srcSet.name+"]"
            print "-->Source directories: "+srcSet.allJava.srcDirs+"\n"
            print "-->Output directories: "+srcSet.output.classesDirs.files+"\n"
            print "-->Compile classpath:\n"
            srcSet.compileClasspath.files.each {
                print "  "+it.path+"\n"
            }
            println ""
        }
    }
}

task nomtamJar (type : Jar) {
    from sourceSets.nomtam.output
    manifest {
        attributes('Implementation-Title': "${project.name}-nomtam",
                   'Implementation-Version': project.version)
    }

    archiveBaseName = "${rootProject.name}-nomtam"
    archiveVersion = project.version
}
